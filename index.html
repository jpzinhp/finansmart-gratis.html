<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinanSmart AI — organização financeira grátis com IA</title>
<meta name="description" content="Registre gastos, acompanhe metas e converse com uma IA que explica seu dinheiro em português claro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F7;--surface:#FFFFFF;--surface2:#F6F9FA;--ink:#0F2230;--muted:#5A7080;--line:#E0E8EC;
  --primary:#0B7A75;--primary-ink:#FFFFFF;--primary-soft:#DFF3F1;--accent:#F4B23E;--accent-soft:#FDF1D8;
  --income:#12946B;--income-soft:#DDF4EA;--expense:#D9443A;--expense-soft:#FBE4E2;--info:#3D63E8;
  --shadow:0 1px 2px rgba(15,34,48,.06),0 6px 20px -8px rgba(15,34,48,.12);
  --r:14px;--r-lg:20px;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--font-b:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A141C;--surface:#102030;--surface2:#142838;--ink:#E7EFF3;--muted:#8CA2B1;--line:#1E3546;
  --primary:#2CC0B4;--primary-ink:#04211F;--primary-soft:#0F3A3B;--accent:#F4B23E;--accent-soft:#3A2E12;
  --income:#3DD6A0;--income-soft:#0F3428;--expense:#FF7A70;--expense-soft:#3C1A19;--info:#7B98FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#0A141C;--surface:#102030;--surface2:#142838;--ink:#E7EFF3;--muted:#8CA2B1;--line:#1E3546;
  --primary:#2CC0B4;--primary-ink:#04211F;--primary-soft:#0F3A3B;--accent:#F4B23E;--accent-soft:#3A2E12;
  --income:#3DD6A0;--income-soft:#0F3428;--expense:#FF7A70;--expense-soft:#3C1A19;--info:#7B98FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.12;letter-spacing:-.02em;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--primary);text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 60%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}.sm{font-size:.875rem}.xs{font-size:.78rem}.num{font-variant-numeric:tabular-nums}
.inc{color:var(--income)}.exp{color:var(--expense)}
.row{display:flex;align-items:center;gap:.6rem}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:grid;gap:1rem}.center{text-align:center}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.65rem 1.15rem;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--expense);border-color:color-mix(in srgb,var(--expense) 35%,var(--line))}
.btn.sm{min-height:36px;padding:.4rem .8rem;font-size:.875rem;border-radius:10px}
.btn.block{width:100%}
.btn.icon{min-width:44px;padding:.5rem}.btn.icon.sm{min-width:36px;padding:.4rem}
.btn[disabled]{opacity:.55;pointer-events:none}

/* form */
.field{display:grid;gap:.35rem;margin-bottom:.9rem}
.field>label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
.inp,.field input,.field select,.field textarea{width:100%;min-height:46px;padding:.6rem .85rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.82rem;color:var(--expense)}
.two{display:grid;grid-template-columns:1fr;gap:0 .8rem}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:.45rem .9rem;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.type button[data-v="expense"][aria-pressed="true"]{color:var(--expense)}
.seg.type button[data-v="income"][aria-pressed="true"]{color:var(--income)}
.check{display:flex;align-items:center;gap:.6rem;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--primary)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1rem;box-shadow:var(--shadow)}
.card>h3,.card .ch h3{font-size:1.05rem}
.ch{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.9rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:1.6fr 1fr}}
.kpi{padding:1rem}
.kpi .k{font-size:.82rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:.4rem}
.kpi .v{font-family:var(--font-d);font-size:clamp(1.25rem,4.4vw,1.75rem);font-weight:700;margin-top:.25rem;letter-spacing:-.02em}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:.15rem}
.kpi.first{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.kpi.first .k,.kpi.first .s{color:color-mix(in srgb,var(--primary-ink) 78%,transparent)}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:700;padding:.15rem .55rem;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--income-soft);color:var(--income);border-color:transparent}
.badge.bad{background:var(--expense-soft);color:var(--expense);border-color:transparent}
.badge.warn{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 70%,var(--ink));border-color:transparent}
.badge.pri{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.progress{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress.warn>i{background:var(--accent)}.progress.bad>i{background:var(--expense)}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.empty .i{width:34px;height:34px;margin-bottom:.4rem;opacity:.6}
.empty h4{color:var(--ink);font-size:1.05rem;margin-bottom:.25rem}
.banner{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);font-size:.9rem}
.banner.info{background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.banner .btn{margin-left:auto}

/* list rows */
.li{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface2)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-weight:700;text-align:right;white-space:nowrap}
.li.done .t{opacity:.6}
.actions{display:flex;gap:.2rem}

/* charts */
.chart{width:100%;max-width:760px;margin-inline:auto;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-b);font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .bar{transition:opacity .15s}
.chart .bar:hover,.chart .pt:hover,.chart .arc:hover{opacity:.75}
.legend{display:grid;gap:.45rem;font-size:.9rem}
.legend .row{justify-content:space-between}
.donut-wrap{display:grid;gap:1rem;align-items:center}
@media(min-width:520px){.donut-wrap{grid-template-columns:180px 1fr}}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);padding:.4rem .65rem;border-radius:9px;font-size:.8rem;font-weight:600;max-width:240px;box-shadow:var(--shadow)}

/* modal/toast */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(6,16,24,.55);display:grid;align-items:end;justify-items:center;backdrop-filter:blur(3px)}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.overlay{align-items:center;padding:1rem}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:1.25rem}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;display:grid;gap:.5rem;width:min(92vw,420px)}
@media(min-width:1024px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow);animation:up .2s}
.toast.err{background:var(--expense);color:#fff}

/* auth pages */
.auth{min-height:100vh;display:grid;place-items:center;padding:1.2rem}
.auth-card{width:100%;max-width:440px}
.auth-card h1{font-size:1.9rem;margin:1rem 0 .3rem}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--font-d);font-weight:800;font-size:1.2rem;letter-spacing:-.03em;color:var(--ink)}
.brand svg{width:34px;height:34px}
.brand small{font-weight:600;color:var(--primary)}
.plan-mini{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.75rem 1rem;border-radius:14px;background:var(--primary-soft);margin:1rem 0}

/* landing */
.l-head{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.l-head .in{max-width:1160px;margin:auto;padding:.7rem 1.1rem;display:flex;align-items:center;gap:1rem}
.l-nav{display:none;gap:1.4rem;margin-left:1.5rem;font-weight:600;font-size:.95rem}
.l-nav a{color:var(--muted);cursor:pointer}.l-nav a:hover{color:var(--ink)}
@media(min-width:860px){.l-nav{display:flex}}
.wrapx{max-width:1160px;margin:auto;padding:0 1.1rem}
.hero{padding:2.6rem 1.1rem 3rem;display:grid;gap:2.2rem;align-items:center}
@media(min-width:940px){.hero{grid-template-columns:1.1fr .9fr;padding:4.5rem 1.1rem}}
.hero h1{font-size:clamp(2.3rem,7vw,4rem);font-weight:800;letter-spacing:-.035em}
.hero p.lead{font-size:1.15rem;color:var(--muted);margin:1.1rem 0 1.6rem;max-width:34rem}
.trust{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;margin-top:1.4rem;font-size:.88rem;color:var(--muted)}
.trust span{display:inline-flex;gap:.4rem;align-items:center}
.sim{padding:1.3rem;border-radius:26px;position:relative}
.sim .ring{width:min(240px,60vw);margin:.4rem auto 0;display:block}
.sim .res{text-align:center;margin-top:-.2rem}
.sim .res b{font-family:var(--font-d);font-size:2.1rem;display:block;letter-spacing:-.03em}
.sim input[type=range]{width:100%;accent-color:var(--primary)}
.sim .ln{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;margin:.7rem 0 .15rem}
.section{padding:3.2rem 0}
.section.alt{background:var(--surface);border-block:1px solid var(--line)}
.section h2{font-size:clamp(1.7rem,4.6vw,2.6rem);max-width:30ch}
.section .sub{color:var(--muted);max-width:44rem;margin:.7rem 0 2rem;font-size:1.05rem}
.feat{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:640px){.feat{grid-template-columns:1fr 1fr}}@media(min-width:960px){.feat{grid-template-columns:repeat(3,1fr)}}
.feat .card{box-shadow:none}
.feat .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:.8rem}
.feat h3{font-size:1.1rem;margin-bottom:.3rem}
.steps{display:grid;gap:1rem}
@media(min-width:860px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{display:flex;gap:1rem}
.step .n{font-family:var(--font-d);font-weight:800;font-size:2.4rem;line-height:1;color:var(--primary);min-width:2rem}
.chat-mock{max-width:560px;display:grid;gap:.7rem}
.bub{padding:.8rem 1rem;border-radius:16px;max-width:92%;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{background:var(--primary);color:var(--primary-ink);justify-self:end;border-bottom-right-radius:4px}
.bub.a{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.a strong{font-weight:700}
.ai-split{display:grid;gap:2rem;align-items:center}
@media(min-width:900px){.ai-split{grid-template-columns:1fr 1fr}}
.plans{display:grid;gap:1rem;align-items:stretch}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{display:flex;flex-direction:column;gap:.9rem;padding:1.4rem;position:relative}
.plan.pop{border:2px solid var(--primary);}
.plan .pt{display:flex;align-items:center;justify-content:space-between}
.plan .price{font-family:var(--font-d);font-size:2.4rem;font-weight:800;letter-spacing:-.04em}
.plan .price small{font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;display:grid;gap:.55rem;font-size:.95rem;flex:1}
.plan li{display:flex;gap:.55rem;align-items:flex-start}
.plan li svg{color:var(--primary);margin-top:2px;width:18px;height:18px}
details.faq{border-bottom:1px solid var(--line);padding:1rem 0}
details.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem}
details.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--primary)}
details.faq[open] summary::after{content:"–"}
details.faq p{color:var(--muted);margin-top:.6rem;max-width:60ch}
.foot{padding:2.4rem 0 3rem;color:var(--muted);font-size:.88rem}
.foot .wrapx{display:grid;gap:1rem}

/* app shell */
.shell{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:.6rem 1rem;padding-top:calc(.6rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.6rem}
.top h2{font-size:1.25rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .m-brand{display:flex}
.main{padding:1rem 1rem calc(96px + env(safe-area-inset-bottom));max-width:1240px;margin:auto}
.bell{position:relative}
.bell b{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--expense);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom))}
.tabbar button{display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);padding:.35rem 0;border-radius:12px;min-height:50px}
.tabbar button[aria-current="page"]{color:var(--primary)}
.tabbar .fab{background:var(--primary);color:var(--primary-ink);width:52px;height:52px;border-radius:50%;margin:-22px auto 0;display:grid;place-items:center;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 70%,#000);min-height:0;padding:0}
.tabbar .fab svg{width:24px;height:24px}
.nav-link{display:flex;align-items:center;gap:.75rem;padding:.7rem .9rem;border-radius:12px;font-weight:600;color:var(--muted);width:100%;text-align:left;min-height:44px}
.nav-link:hover{background:var(--surface2);color:var(--ink)}
.nav-link[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.nav-link .badge{margin-left:auto}
.desk-only{display:none}
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;height:100vh;padding:1.2rem .9rem;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .tabbar,.top .m-brand{display:none}
  .main{padding:1.4rem 2rem 3rem}
  .top{padding:.9rem 2rem}
  .desk-only{display:inline-flex}
}
.side nav{display:grid;gap:2px}
.side .usr{margin-top:auto;display:grid;gap:.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-d);flex:none}
.page-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.page-h h1{font-size:1.6rem}
.month-nav{display:inline-flex;align-items:center;gap:.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.month-nav span{display:inline-block;min-width:120px;text-align:center;font-weight:600;font-size:.92rem}.month-nav span::first-letter{text-transform:uppercase}.grid>*{min-width:0}
.filters{display:grid;gap:.6rem;grid-template-columns:1fr 1fr;margin-bottom:.8rem}
.filters .search{grid-column:1/-1;position:relative}
.filters .search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.filters .search input{padding-left:40px}
@media(min-width:900px){.filters{grid-template-columns:2fr repeat(4,1fr)}.filters .search{grid-column:auto}}
.tag-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;padding:.3rem 0}
.cal .d{min-height:58px;border-radius:10px;border:1px solid var(--line);padding:.3rem;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-size:.78rem;position:relative}
@media(min-width:760px){.cal .d{min-height:86px;padding:.4rem}}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .d.sel{background:var(--primary-soft)}
.cal .d b{font-weight:700}
.cal .mk{display:flex;gap:3px;flex-wrap:wrap}
.cal .mk i{width:7px;height:7px;border-radius:50%;display:block}
.cal .amt{display:none;font-size:.7rem;font-weight:700}
@media(min-width:760px){.cal .amt{display:block}.cal .mk{display:none}}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:700;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.6rem .4rem;border-bottom:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.scroll-x{overflow-x:auto}
.ai-chat{display:grid;gap:.7rem;max-height:52vh;overflow:auto;padding:.3rem .1rem;min-height:160px}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{padding:.45rem .8rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.insight{display:flex;gap:.8rem;padding:.8rem;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.insight .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.insight.warn .ic{background:var(--accent-soft);color:#B7791F}.insight.bad .ic{background:var(--expense-soft);color:var(--expense)}
.thinking{display:inline-flex;gap:4px}.thinking i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.swatches{display:flex;flex-wrap:wrap;gap:.4rem}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatches input:checked+span{border-color:var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--primary)}
.lock{display:grid;place-items:center;text-align:center;gap:.6rem;padding:2rem 1rem}
#pixQr{width:min(230px,72%);margin:1rem auto;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}#pixQr svg{display:block;width:100%;height:auto}
.lock .i{width:38px;height:38px;color:var(--primary)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const _brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>_brl.format(Math.round((n||0)*100)/100).replace(/\u00a0/g,' ');
const r2=n=>Math.round(n*100)/100;
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const curMonth=()=>today().slice(0,7);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(mk,n)=>{const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};
const fmtD=s=>parseD(s).toLocaleDateString('pt-BR');
const fmtDS=s=>parseD(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
const monthLbl=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const monthShort=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')};
const weekday=s=>parseD(s).toLocaleDateString('pt-BR',{weekday:'long'});
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const startOfWeek=s=>{const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}
};

const ICONS={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',

user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
chevL:'<path d="m15 18-6-6 6-6"/>',chevR:'<path d="m9 18 6-6-6-6"/>',

alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const ico=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--primary)"/><path d="M8 21.5l5.2-5.4 4 3.2L24 11" fill="none" stroke="var(--primary-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24.4" cy="10.6" r="2.4" fill="var(--accent)"/></svg>';

/* ================= constantes ================= */
const SWATCH=['#F59E0B','#3B82F6','#8B5CF6','#EC4899','#06B6D4','#F97316','#10B981','#64748B','#EF4444','#84CC16','#14B8A6','#A855F7'];
const DEF_CATS=[
 {id:'c-alim',name:'Alimentação',type:'expense',color:'#F59E0B'},{id:'c-transp',name:'Transporte',type:'expense',color:'#3B82F6'},
 {id:'c-casa',name:'Casa',type:'expense',color:'#8B5CF6'},{id:'c-lazer',name:'Lazer',type:'expense',color:'#EC4899'},
 {id:'c-estudos',name:'Estudos',type:'expense',color:'#06B6D4'},{id:'c-compras',name:'Compras',type:'expense',color:'#F97316'},
 {id:'c-saude',name:'Saúde',type:'expense',color:'#10B981'},{id:'c-contas',name:'Contas e serviços',type:'expense',color:'#64748B'},
 {id:'c-outros',name:'Outros',type:'expense',color:'#94A3B8'},
 {id:'c-salario',name:'Salário',type:'income',color:'#12946B'},{id:'c-free',name:'Freelance',type:'income',color:'#22C55E'},
 {id:'c-invest',name:'Rendimentos',type:'income',color:'#0EA5E9'},{id:'c-outras',name:'Outras receitas',type:'income',color:'#84CC16'}];
const ACC_TYPES={conta:'Conta corrente',carteira:'Carteira',poupanca:'Poupança / investimento',cartao:'Cartão de crédito'};
const PLANS=[
 {id:'essencial',name:'Essencial',m:19.9,y:199,tag:'Para começar a se organizar',feat:['Painel com saldo, receitas, despesas e economia','Lançamentos, categorias personalizadas, busca e filtros','Até 3 contas e cartões','Metas e orçamento mensal por categoria','Calendário, lembretes e relatórios por mês e ano']},
 {id:'pro',name:'Pro',m:39.9,y:399,pop:true,tag:'O mais escolhido',feat:['Tudo do Essencial','IA Financeira (até 30 perguntas por mês)','Contas e cartões ilimitados','Lançamentos recorrentes e parcelados','Relatórios por dia, semana, mês e ano','Exportação dos lançamentos em CSV']},
 {id:'premium',name:'Premium',m:69.9,y:699,tag:'Para quem quer usar a IA sem limites',feat:['Tudo do Pro','IA Financeira sem limite de perguntas','Histórico de conversas da IA salvo','Backup e restauração completa dos dados']}];
const PL={
 essencial:{ai:0,acc:3,rec:false,csv:false,fine:false,backup:false,hist:false},
 pro:{ai:30,acc:999,rec:true,csv:true,fine:true,backup:false,hist:false},
 premium:{ai:Infinity,acc:999,rec:true,csv:true,fine:true,backup:true,hist:true}};
const planOf=id=>PLANS.find(p=>p.id===id)||PLANS[0];
const NAV=[['dashboard','Painel','home'],['lancamentos','Lançamentos','list'],['contas','Contas e cartões','wallet'],['recorrentes','A pagar e recorrentes','repeat'],['calendario','Calendário','calendar'],['metas','Metas','target'],['orcamento','Orçamento','pie'],['relatorios','Relatórios','chart'],['ia','IA Financeira','sparkle'],['notificacoes','Notificações','bell'],['configuracoes','Configurações','settings']];

/* ================= estado ================= */
const S={users:LS.get('fs:users',[]),user:null,data:null,
 ui:{month:curMonth(),f:{q:'',type:'',cat:'',acc:'',status:'',period:'month'},limit:60,repP:'month',repRef:today(),calSel:null,aiTurns:[],aiBusy:false,billing:'m',txType:'expense',menu:false}};
function saveUsers(){LS.set('fs:users',S.users)}
function save(){if(S.user&&S.data)LS.set('fs:data:'+S.user.id,S.data)}
const D=()=>S.data;

function newData(){return{v:1,accounts:[{id:'a-main',name:'Conta principal',type:'conta',initial:0,color:'#0B7A75'}],categories:DEF_CATS.map(c=>({...c})),transactions:[],recurring:[],goals:[],budgets:{},reminders:[],notifRead:{},aiChat:[],ai:{month:curMonth(),count:0},demo:false,demoBudgets:[],settings:{notifDays:3}}}
function loadData(){
  let d=LS.get('fs:data:'+S.user.id,null);
  if(!d||typeof d!=='object')d=newData();
  const base=newData();for(const k of Object.keys(base))if(d[k]==null)d[k]=base[k];
  S.data=d;materialize();save();
}

/* ================= tema ================= */
function applyTheme(){const t=LS.get('fs:theme','system');const h=document.documentElement;if(t==='system')h.removeAttribute('data-theme');else h.setAttribute('data-theme',t)}
function isDark(){const t=LS.get('fs:theme','system');return t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)}

/* ================= modelo e cálculos ================= */
const catOf=id=>D().categories.find(c=>c.id===id)||{id:id||'x',name:'Sem categoria',color:'#94A3B8',type:'expense'};
const accOf=id=>D().accounts.find(a=>a.id===id);
const isCard=a=>!!a&&a.type==='cartao';
function delta(a,t){
  if(t.type==='income')return t.accountId===a.id?t.amount:0;
  if(t.type==='expense')return t.accountId===a.id?-t.amount:0;
  let x=0;if(t.accountId===a.id)x-=t.amount;if(t.toAccountId===a.id)x+=t.amount;return x}
function balance(a){let s=a.initial||0;for(const t of D().transactions)if(t.paid)s+=delta(a,t);return r2(s)}
const assetsTotal=()=>r2(D().accounts.filter(a=>!isCard(a)).reduce((s,a)=>s+balance(a),0));
const cardUsed=a=>Math.max(0,-balance(a));
const cardsTotal=()=>r2(D().accounts.filter(isCard).reduce((s,a)=>s+cardUsed(a),0));
function assetsAt(date){
  const as=D().accounts.filter(a=>!isCard(a));let s=as.reduce((x,a)=>x+(a.initial||0),0);
  for(const t of D().transactions){if(!t.paid||t.date>date)continue;for(const a of as)s+=delta(a,t)}return r2(s)}
const monthRange=mk=>[mk+'-01',mk+'-'+pad(dim(mk))];
function txRange(from,to,pending){return D().transactions.filter(t=>t.type!=='transfer'&&t.date>=from&&t.date<=to&&(pending||t.paid))}
function sumsOf(list){let inc=0,exp=0;for(const t of list){if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount}return{inc:r2(inc),exp:r2(exp),net:r2(inc-exp)}}
function monthSums(mk,pending){const[a,b]=monthRange(mk);return sumsOf(txRange(a,b,pending))}
function catTotals(list,type){const m={};for(const t of list){if(t.type!==type)continue;m[t.categoryId]=(m[t.categoryId]||0)+t.amount}return Object.entries(m).map(([id,v])=>({id,v:r2(v),c:catOf(id)})).sort((a,b)=>b.v-a.v)}
function budgetRows(mk){
  const [a,b]=monthRange(mk);const list=txRange(a,b,true).filter(t=>t.type==='expense');
  const sp={};for(const t of list)sp[t.categoryId]=(sp[t.categoryId]||0)+t.amount;
  return Object.entries(D().budgets).filter(([id,v])=>v>0&&D().categories.some(c=>c.id===id)).map(([id,limit])=>({id,c:catOf(id),limit,spent:r2(sp[id]||0),p:pct(sp[id]||0,limit)})).sort((x,y)=>y.p-x.p)}
function pendingList(days){const tk=today(),end=days==null?'9999-12-31':addDays(tk,days);return D().transactions.filter(t=>!t.paid&&t.type!=='transfer'&&t.date<=end).sort((a,b)=>a.date.localeCompare(b.date))}
function goalInfo(g){
  const saved=g.saved||0,left=Math.max(0,g.target-saved),p=Math.min(100,pct(saved,g.target));
  const days=g.deadline?diffDays(today(),g.deadline):null;
  const months=days==null?null:Math.max(1,Math.ceil(days/30.44));
  return{saved,left,p,days,months,monthly:months&&left>0?r2(left/months):0,done:saved>=g.target,late:days!=null&&days<0&&saved<g.target}}

/* ================= recorrências ================= */
const horizon=()=>addDays(addMonths(curMonth(),3)+'-01',-1);
function occurrences(r,hz){
  const out=[];let n=0;
  const okEnd=d=>(!r.end||d<=r.end);
  if(r.freq==='weekly'){let d=r.start;while(d<=hz&&okEnd(d)&&(!r.count||n<r.count)&&n<520){n++;out.push({date:d,n});d=addDays(d,7)}}
  else if(r.freq==='yearly'){let y=+r.start.slice(0,4);const m=r.start.slice(5,7),dd=+r.start.slice(8);
    while(n<60){const day=Math.min(dd,dim(y+'-'+m));const d=y+'-'+m+'-'+pad(day);if(d>hz||!okEnd(d)||(r.count&&n>=r.count))break;n++;out.push({date:d,n});y++}}
  else{let mk=r.start.slice(0,7);const dd=+r.start.slice(8);
    while(n<600){const d=mk+'-'+pad(Math.min(dd,dim(mk)));if(d>hz||!okEnd(d)||(r.count&&n>=r.count))break;n++;out.push({date:d,n});mk=addMonths(mk,1)}}
  return out}
function materialize(){
  const d=D();let ch=false;const tk=today(),hz=horizon();
  const have=new Set(d.transactions.filter(t=>t.recurringId).map(t=>t.recurringId+'|'+t.date));
  for(const r of d.recurring){
    if(r.active===false)continue;
    for(const o of occurrences(r,hz)){
      if(have.has(r.id+'|'+o.date)||(r.skip||[]).includes(o.date))continue;
      d.transactions.push({id:uid(),type:r.type,amount:r.amount,date:o.date,desc:r.desc+(r.count?' ('+o.n+'/'+r.count+')':''),categoryId:r.categoryId,accountId:r.accountId,paid:!!r.auto&&o.date<=tk,recurringId:r.id,demo:r.demo||undefined,createdAt:Date.now()});ch=true}}
  for(const t of d.transactions){
    if(t.recurringId&&!t.paid&&!t.lock&&t.date<=tk){const r=d.recurring.find(x=>x.id===t.recurringId);if(r&&r.auto&&r.active!==false){t.paid=true;ch=true}}}
  if(ch)save()}

/* ================= notificações ================= */
function buildNotifs(){
  const d=D(),tk=today(),nd=d.settings.notifDays||3,out=[];
  for(const t of pendingList(null)){
    const days=diffDays(tk,t.date);const a=t.type==='income'?'receber':'pagar';
    if(days<0)out.push({id:'od:'+t.id,kind:'bad',title:(t.type==='income'?'Receita em atraso: ':'Conta atrasada: ')+t.desc,text:brl(t.amount)+' venceu em '+fmtD(t.date)+'. Marque como '+(t.type==='income'?'recebida':'paga')+' ou ajuste a data.',date:t.date,go:'/app/recorrentes'});
    else if(days<=nd)out.push({id:'due:'+t.id+':'+t.date,kind:'warn',title:t.desc+(days===0?' vence hoje':days===1?' vence amanhã':' vence em '+days+' dias'),text:'Valor a '+a+': '+brl(t.amount)+' ('+fmtD(t.date)+').',date:t.date,go:'/app/recorrentes'})}
  for(const b of budgetRows(curMonth())){
    if(b.p>=100)out.push({id:'bud100:'+b.id+':'+curMonth(),kind:'bad',title:'Orçamento de '+b.c.name+' estourou',text:'Você já usou '+brl(b.spent)+' de '+brl(b.limit)+' neste mês.',date:tk,go:'/app/orcamento'});
    else if(b.p>=80)out.push({id:'bud80:'+b.id+':'+curMonth(),kind:'warn',title:'Orçamento de '+b.c.name+' em '+b.p+'%',text:'Restam '+brl(b.limit-b.spent)+' até o fim do mês.',date:tk,go:'/app/orcamento'})}
  for(const g of d.goals){const i=goalInfo(g);
    if(i.done)out.push({id:'goalok:'+g.id,kind:'ok',title:'Meta atingida: '+g.name,text:'Você chegou a '+brl(g.target)+'. Parabéns!',date:tk,go:'/app/metas'});
    else if(i.days!=null&&i.days<0)out.push({id:'goallate:'+g.id,kind:'bad',title:'Prazo vencido: '+g.name,text:'Faltam '+brl(i.left)+'. Ajuste o prazo ou o valor da meta.',date:tk,go:'/app/metas'});

const rndHex=n=>{const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return Array.from(a).map(b=>pad(b.toString(16))).join('')};
async function hashPw(pw,salt){
  if(window.crypto&&crypto.subtle){
    const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const sb=Uint8Array.from(salt.match(/.{2}/g).map(h=>parseInt(h,16)));
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:sb,iterations:120000,hash:'SHA-256'},key,256);
    return Array.from(new Uint8Array(bits)).map(b=>pad(b.toString(16))).join('')}
  let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+(h>>>0).toString(16)}

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const n=v/e;return(n<=1?1:n<=2?2:n<=5?5:10)*e}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
function barChart(items,aria){
  const W=560,H=210,L=46,B=24,T=10,R=6,iw=W-L-R,ih=H-T-B;
  const max=niceMax(Math.max(1,...items.flatMap(i=>[i.a||0,i.b||0])));
  let g='',bars='',lab='';
  for(let k=0;k<=4;k++){const y=T+ih-ih*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(max*k/4)+'</text>'}
  const n=items.length,slot=iw/n,bw=Math.max(3,Math.min(22,slot*.36)),step=Math.ceil(n/12);
  items.forEach((it,i)=>{
    const cx=L+slot*i+slot/2,ha=ih*(it.a||0)/max,hb=ih*(it.b||0)/max;
    bars+='<rect class="bar" x="'+(cx-bw-1)+'" y="'+(T+ih-ha)+'" width="'+bw+'" height="'+(it.a?Math.max(ha,1.5):0)+'" rx="2.5" fill="var(--income)" data-tip="'+esc(it.tipA)+'"/>';
    bars+='<rect class="bar" x="'+(cx+1)+'" y="'+(T+ih-hb)+'" width="'+bw+'" height="'+(it.b?Math.max(hb,1.5):0)+'" rx="2.5" fill="var(--expense)" data-tip="'+esc(it.tipB)+'"/>';

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria||'Gráfico de barras')+'"><g class="grid">'+g+'</g>'+bars+lab+'</svg>'}
function lineChart(pts,aria){
  const W=560,H=210,L=46,B=24,T=14,R=14,iw=W-L-R,ih=H-T-B,id='lg'+(++_gid);
  let lo=Math.min(0,...pts.map(p=>p.v)),hi=Math.max(1,...pts.map(p=>p.v));
  const span=niceMax(hi-lo);hi=lo+span;
  const X=i=>L+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=v=>T+ih-ih*(v-lo)/(hi-lo);
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>'}
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=path+' L'+X(pts.length-1).toFixed(1)+' '+Y(lo).toFixed(1)+' L'+X(0).toFixed(1)+' '+Y(lo).toFixed(1)+' Z';
  const step=Math.ceil(pts.length/8);
  const dots=pts.map((p,i)=>'<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(pts.length>16?3:5)+'" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5" data-tip="'+esc(p.tip)+'"/>').join('');

function donut(slices,centerTop,centerBottom){
  const total=slices.reduce((s,x)=>s+x.v,0),R=60,C=2*Math.PI*R;let off=0;

  return '<svg class="chart" viewBox="0 0 160 160" role="img" aria-label="Gráfico de rosca"><circle r="'+R+'" cx="80" cy="80" fill="none" stroke="var(--surface2)" stroke-width="22"/>'+arcs+'<text x="80" y="76" text-anchor="middle">'+esc(centerTop)+'</text><text x="80" y="95" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--font-d)">'+esc(centerBottom)+'</text></svg>'}

function filteredTx(){

  return D().transactions.filter(t=>{
    if(f.period==='month'&&(t.date<a||t.date>b))return false;
    if(f.type&&t.type!==f.type)return false;if(f.cat&&t.categoryId!==f.cat)return false;
    if(f.acc&&t.accountId!==f.acc&&t.toAccountId!==f.acc)return false;
    if(f.status==='paid'&&!t.paid)return false;if(f.status==='pending'&&t.paid)return false;if(f.status==='late'&&(t.paid||t.date>=tk))return false;
    if(q&&!(t.desc+' '+catOf(t.categoryId).name+' '+((accOf(t.accountId)||{}).name||'')+' '+String(t.amount).replace('.',',')).toLowerCase().includes(q))return false;

/* ---------- relatórios ---------- */
function repRange(p,ref){
  if(p==='day')return[ref,ref,fmtD(ref)+' · '+cap(weekday(ref))];
  if(p==='week'){const s=startOfWeek(ref),e=addDays(s,6);return[s,e,fmtDS(s)+' a '+fmtDS(e)+' de '+e.slice(0,4)]}
  if(p==='month'){const mk=ref.slice(0,7);const r=monthRange(mk);return[r[0],r[1],cap(monthLbl(mk))]}
  const y=ref.slice(0,4);return[y+'-01-01',y+'-12-31','Ano de '+y]}
function repShift(p,ref,k){if(p==='day')return addDays(ref,k);if(p==='week')return addDays(ref,7*k);if(p==='month')return addMonths(ref.slice(0,7),k)+'-01';return(+ref.slice(0,4)+k)+'-01-01'}
function repBuckets(p,from,to,pend){
  const list=txRange(from,to,pend),mk=(lab,test,full)=>{const s=sumsOf(list.filter(test));return{label:lab,a:s.inc,b:s.exp,tipA:full+' · Receitas: '+brl(s.inc),tipB:full+' · Despesas: '+brl(s.exp),tipAll:full+'\nReceitas '+brl(s.inc)+' · Despesas '+brl(s.exp)}};
  const out=[];
  if(p==='week')for(let i=0;i<7;i++){const ds=addDays(from,i);out.push(mk(cap(parseD(ds).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')),t=>t.date===ds,fmtDS(ds)))}
  else if(p==='month'){const mkk=from.slice(0,7);for(let i=1;i<=dim(mkk);i++){const ds=mkk+'-'+pad(i);out.push(mk(String(i),t=>t.date===ds,fmtDS(ds)))}}
  else if(p==='year'){const y=from.slice(0,4);for(let i=1;i<=12;i++){const m=y+'-'+pad(i);out.push(mk(cap(monthShort(m)),t=>t.date.slice(0,7)===m,cap(monthLbl(m))))}}
  return out}
function csvOf(list){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['Data','Tipo','Descrição','Categoria','Conta','Valor','Situação']];
  for(const t of list){const a=accOf(t.accountId),b=t.toAccountId?accOf(t.toAccountId):null;
    rows.push([fmtD(t.date),t.type==='income'?'Receita':t.type==='expense'?'Despesa':'Transferência',t.desc,t.type==='transfer'?'':catOf(t.categoryId).name,(a?a.name:'')+(b?' > '+b.name:''),(t.type==='expense'?-t.amount:t.amount).toFixed(2).replace('.',','),t.paid?'Pago/recebido':'Pendente'])}
  return rows.map(r=>r.map(q).join(';')).join('\r\n')}
function pageRel(){
  const p=S.ui.repP,ref=S.ui.repRef,pend=!!S.ui.repPend,[from,to,label]=repRange(p,ref),list=txRange(from,to,pend),s=sumsOf(list);
  const days=Math.max(1,diffDays(from,to)+1),ex=catTotals(list,'expense'),inc=catTotals(list,'income');
  const periods=[['day','Dia'],['week','Semana'],['month','Mês'],['year','Ano']];

let SAMPLE=null,AICTL=null;
function localInsights(){
  const mk=curMonth(),pm=addMonths(mk,-1),out=[],d=D();
  const s=monthSums(mk,false),ps=monthSums(pm,false);
  if(!d.transactions.length)return[{k:'info',t:'Ainda não há dados para analisar',p:'Cadastre alguns lançamentos e a análise automática aparece aqui.'}];
  if(s.inc>0){const r=Math.round(s.net/s.inc*100);out.push({k:r>=20?'ok':r>=0?'info':'bad',t:r>=0?'Você guardou '+r+'% da receita do mês':'Você gastou mais do que recebeu',p:r>=0?'Sobraram '+brl(s.net)+' de '+brl(s.inc)+' recebidos. Uma referência comum de educação financeira é reservar cerca de 20% da renda, mas o ideal depende da sua realidade.':'As despesas superam as receitas em '+brl(-s.net)+' neste mês. Vale olhar as maiores categorias abaixo.'})}
  const [a,b]=monthRange(mk),ct=catTotals(txRange(a,b,false),'expense');
  if(ct.length&&s.exp>0)out.push({k:'info',t:'Maior gasto: '+ct[0].c.name,p:brl(ct[0].v)+' ('+pct(ct[0].v,s.exp)+'% das despesas do mês).'});
  if(ps.exp>0&&s.exp>0){const [pa,pb]=monthRange(pm),pc=catTotals(txRange(pa,pb,false),'expense'),pmap=Object.fromEntries(pc.map(x=>[x.id,x.v]));
    let worst=null;for(const c of ct){const diff=c.v-(pmap[c.id]||0);if(diff>=50&&(!worst||diff>worst.diff))worst={c,diff}}
    const day=+today().slice(8),n=dim(mk);
    if(worst)out.push({k:'warn',t:worst.c.c.name+' subiu '+brl(worst.diff)+' em relação ao mês passado',p:'Compare com '+monthLbl(pm)+' para ver se foi algo pontual ou um novo hábito.'});
    if(mk===today().slice(0,7)&&day>=5){const proj=r2(s.exp/day*n);out.push({k:proj>s.inc&&s.inc>0?'warn':'info',t:'Projeção de despesas: '+brl(proj),p:'Mantendo o ritmo dos '+day+' primeiros dias, o mês fecharia com esse valor gasto.'})}}
  for(const r of budgetRows(mk)){if(r.p>=100)out.push({k:'bad',t:'Orçamento de '+r.c.name+' estourou',p:'Gasto e pendente de '+brl(r.spent)+' para um limite de '+brl(r.limit)+'.'});else if(r.p>=80)out.push({k:'warn',t:'Orçamento de '+r.c.name+' em '+r.p+'%',p:'Restam '+brl(r.limit-r.spent)+' até o fim do mês.'})}
  const soon=pendingList(7);if(soon.length){const tot=soon.filter(t=>t.type==='expense').reduce((x,t)=>x+t.amount,0);if(tot>0)out.push({k:'warn',t:'Contas a pagar nos próximos 7 dias: '+brl(tot),p:soon.filter(t=>t.type==='expense').length+' conta(s) pendente(s), incluindo atrasadas.'})}
  const hist=[-3,-2,-1].map(i=>monthSums(addMonths(mk,i),false).exp).filter(x=>x>0);
  if(hist.length){const avg=hist.reduce((x,y)=>x+y,0)/hist.length,as=assetsTotal();if(avg>0)out.push({k:'info',t:'Sua reserva cobre cerca de '+(Math.max(0,as)/avg).toFixed(1).replace('.',',')+' mês(es) de despesas',p:'Comparação entre o saldo das contas ('+brl(as)+') e a sua despesa média mensal ('+brl(avg)+'). Muitos educadores financeiros sugerem uma reserva de 3 a 6 meses.'})}
  return out.slice(0,7)}
function aiContext(){
  const d=D(),mk=curMonth(),ms=[addMonths(mk,-2),addMonths(mk,-1),mk];
  const resumo=ms.map(m=>{const [a,b]=monthRange(m),l=txRange(a,b,false),s=sumsOf(l);return{mes:m,receitas:s.inc,despesas:s.exp,resultado:s.net,despesas_por_categoria:Object.fromEntries(catTotals(l,'expense').slice(0,8).map(x=>[x.c.name,x.v])),receitas_por_categoria:Object.fromEntries(catTotals(l,'income').slice(0,5).map(x=>[x.c.name,x.v]))}});
  return JSON.stringify({hoje:today(),moeda:'BRL',dados_de_exemplo_ficticios:!!d.demo,resumo_mensal:resumo,saldo_total_das_contas:assetsTotal(),faturas_de_cartao_em_aberto:cardsTotal(),
   contas:d.accounts.map(a=>isCard(a)?{nome:a.name,tipo:'cartão',fatura:cardUsed(a),limite:a.limit||0}:{nome:a.name,tipo:ACC_TYPES[a.type],saldo:balance(a)}),

async function askAI(text){
  text=String(text||'').trim();if(!text||S.ui.aiBusy)return;
  if(!SAMPLE){toast('A IA não está disponível neste ambiente.',true);return}
  const lim=can('ai');if(!lim){upsell('A IA Financeira faz parte dos planos Pro e Premium.');return}
  const d=D();if(d.ai.month!==curMonth())d.ai={month:curMonth(),count:0};
  if(d.ai.count>=lim){upsell('Você usou as '+lim+' perguntas deste mês. No Premium a IA não tem limite.');return}
  S.ui.aiTurns.push({role:'user',content:text});S.ui.aiBusy=true;AICTL=new AbortController();renderAiChat();
  let partial='';
  try{
    const r=await SAMPLE(aiPayload(),{cache:false,signal:AICTL.signal,onText:({text:tx})=>{partial=tx;const el=$('#aiLive');if(el){el.innerHTML=mdLite(tx);const c=$('#aiChat');if(c)c.scrollTop=c.scrollHeight}}});
    S.ui.aiTurns.push({role:'assistant',content:r.text+(r.truncated?'\n\n(Resposta cortada. Peça para continuar ou faça uma pergunta menor.)':'')});d.ai.count++;
  }catch(e){
    const code=e&&e.code;
    if(partial){S.ui.aiTurns.push({role:'assistant',content:partial+'\n\n(Resposta interrompida.)'});if(code!=='cancelled')d.ai.count++}
    else S.ui.aiTurns.pop();
    if(code==='not_granted'||code==='sampling_disabled')toast('A IA não foi autorizada neste ambiente.',true);
    else if(code==='rate_limited')toast('Limite de uso da IA atingido. Tente de novo mais tarde.',true);
    else if(code!=='cancelled')toast('Não foi possível obter a resposta. Tente novamente.',true)}
  finally{S.ui.aiBusy=false;AICTL=null;if(can('hist'))d.aiChat=S.ui.aiTurns.slice(-40);save();if(curPath().p==='/app/ia')render()}}
function plannerCalc(name,target,months){
  const mk=curMonth(),nets=[-3,-2,-1].map(i=>addMonths(mk,i)).filter(m=>D().transactions.some(t=>t.date.slice(0,7)===m&&t.type!=='transfer')).map(m=>monthSums(m,false).net);
  const cap=nets.length?nets.reduce((a,b)=>a+b,0)/nets.length:null,need=r2(target/months);
  let msg;
  if(cap==null)msg='Ainda não há meses completos cadastrados para estimar quanto você consegue guardar. Cadastre mais lançamentos para uma estimativa melhor.';
  else if(cap>=need)msg='Nos últimos meses você guardou em média '+brl(cap)+' por mês, então o valor necessário cabe no seu ritmo atual.';
  else if(cap>0)msg='Você guardou em média '+brl(cap)+' por mês, abaixo dos '+brl(need)+' necessários. Com o ritmo atual, a meta levaria cerca de '+Math.ceil(target/cap)+' meses.';
  else msg='Nos últimos meses as despesas foram iguais ou maiores que as receitas, então o primeiro passo seria abrir espaço no orçamento.';
  return{need,cap,msg}}

/* ================= modais, toasts ================= */
function openModal(html){$('#modal').innerHTML='<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';const f=$('#modal input:not([type=hidden]):not([disabled]),#modal select,#modal textarea');if(f&&!('ontouchstart' in window))f.focus()}
function closeModal(){$('#modal').innerHTML=''}
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
const mHead=t=>'<div class="row between"><h3>'+t+'</h3><button class="btn ghost icon" data-act="closeModal" aria-label="Fechar">'+ico('x')+'</button></div>';
const mFoot=(l)=>'<div class="err" id="ferr" role="alert"></div><div class="row" style="justify-content:flex-end;margin-top:.4rem"><button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">'+(l||'Salvar')+'</button></div>';
let CONFIRM=null;
function confirmBox(o){CONFIRM=o.onOk;openModal(mHead(o.title)+'<p class="muted" style="margin:.8rem 0 1.2rem">'+o.text+'</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn '+(o.danger?'danger':'primary')+'" data-act="confirmOk">'+(o.ok||'Confirmar')+'</button></div>')}
function upsell(msg){openModal(mHead('Recurso de outro plano')+'<p class="muted" style="margin:.8rem 0 1.2rem">'+esc(msg)+'</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Agora não</button><button class="btn primary" data-act="goPlans">Ver planos</button></div>')}
const ferr=(f,m,id)=>{const e=$('#'+(id||'ferr'),f.ownerDocument);if(e)e.textContent=m||''};
const swatches=sel=>'<div class="swatches" role="radiogroup" aria-label="Cor">'+SWATCH.map(c=>'<label><input type="radio" name="color" value="'+c+'"'+(c===sel?' checked':'')+'><span style="background:'+c+'"></span></label>').join('')+'</div>';
async function deliver(name,text){
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(!dl)throw{code:'unavailable'};await dl.save({filename:name,data:text});toast('Arquivo pronto: '+name)}
  catch(e){if(e&&e.code==='declined')return;openModal(mHead('Copie seu arquivo')+'<p class="muted sm" style="margin:.6rem 0">O download direto não está disponível aqui. Copie o texto abaixo e salve em um arquivo chamado <b>'+esc(name)+'</b>.</p><textarea class="inp" id="copyArea" readonly rows="9" style="width:100%">'+esc(text)+'</textarea><div class="row" style="justify-content:flex-end;margin-top:.8rem"><button class="btn primary" data-act="copyArea">Copiar</button></div>')}}

function submitTxn(f){
  const v=Object.fromEntries(new FormData(f)),d=D(),type=v.type,amount=r2(parseFloat(v.amount));
  if(!(amount>0))return ferr(f,'Informe um valor maior que zero.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date||''))return ferr(f,'Informe uma data válida.');
  if(!accOf(v.accountId))return ferr(f,'Escolha uma conta.');
  if(type==='transfer'&&(!accOf(v.toAccountId)||v.toAccountId===v.accountId))return ferr(f,'Escolha duas contas diferentes.');
  if(type!=='transfer'&&!d.categories.some(c=>c.id===v.categoryId))return ferr(f,'Escolha uma categoria.');
  const desc=(v.desc||'').trim()||(type==='transfer'?'Transferência':catOf(v.categoryId).name);
  const base={type,amount,date:v.date,desc,accountId:v.accountId,categoryId:type==='transfer'?null:v.categoryId,toAccountId:type==='transfer'?v.toAccountId:null};
  if(v.id){const t=d.transactions.find(x=>x.id===v.id);if(!t)return closeModal();Object.assign(t,base,{paid:!!v.paid});if(t.recurringId)t.lock=true;toast('Lançamento atualizado')}
  else if(v.freq){
    if(!can('rec')){closeModal();return upsell('Lançamentos recorrentes e parcelados fazem parte dos planos Pro e Premium.')}
    const cnt=parseInt(v.count,10);d.recurring.push({id:uid(),type,amount,desc,categoryId:base.categoryId,accountId:v.accountId,toAccountId:base.toAccountId,start:v.date,freq:v.freq,count:cnt>1?cnt:null,auto:true,active:true,skip:[]});materialize();toast('Recorrência criada')}
  else{d.transactions.push(Object.assign({id:uid(),paid:!!v.paid,createdAt:Date.now()},base));toast('Lançamento salvo')}
  save();closeModal();render()}

/* ================= demonstração ================= */
function loadDemo(){
  const d=D();if(d.demo)return;d.demo=true;const tk=today(),mk=curMonth();
  const A={id:'demo-a1',name:'Conta Exemplo',type:'conta',initial:1800,color:'#3B82F6',demo:true},C={id:'demo-a2',name:'Cartão Exemplo',type:'cartao',initial:0,limit:4000,closingDay:20,dueDay:27,color:'#8B5CF6',demo:true};
  d.accounts.push(A,C);
  const R=o=>Object.assign({id:uid(),active:true,auto:true,skip:[],demo:true,count:null,freq:'monthly'},o),s0=day=>addMonths(mk,-3)+'-'+day;
  d.recurring.push(R({type:'income',amount:5200,desc:'Salário (exemplo)',categoryId:'c-salario',accountId:A.id,start:s0('05')}),R({type:'expense',amount:1450,desc:'Aluguel (exemplo)',categoryId:'c-casa',accountId:A.id,start:s0('08')}),R({type:'expense',amount:109.9,desc:'Internet (exemplo)',categoryId:'c-contas',accountId:A.id,start:s0('12')}),R({type:'expense',amount:39.9,desc:'Streaming (exemplo)',categoryId:'c-lazer',accountId:C.id,start:s0('15')}),R({type:'expense',amount:99,desc:'Academia (exemplo)',categoryId:'c-saude',accountId:A.id,start:s0('10')}));
  materialize();
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let k=3;k>=0;k--){const m=addMonths(mk,-k),last=k===0?+tk.slice(8):dim(m);
    const add=(day,type,amount,desc,cat,acc)=>{if(day>last)return;d.transactions.push({id:uid(),type,amount:r2(amount),date:m+'-'+pad(day),desc,categoryId:cat,accountId:acc,paid:true,demo:true,createdAt:Date.now()+Math.floor(rnd()*1000)})};
    [3,10,17,24].forEach(dd=>add(dd,'expense',300+rnd()*180,'Supermercado (exemplo)','c-alim',C.id));
    add(6,'expense',180+rnd()*60,'Combustível (exemplo)','c-transp',A.id);add(19,'expense',60+rnd()*50,'Transporte por app (exemplo)','c-transp',C.id);
    add(14,'expense',120+rnd()*90,'Restaurante (exemplo)','c-lazer',C.id);add(22,'expense',60+rnd()*140,'Cinema e passeios (exemplo)','c-lazer',C.id);
    add(11,'expense',70+rnd()*120,'Farmácia (exemplo)','c-saude',A.id);add(18,'expense',150+rnd()*250,'Compras (exemplo)','c-compras',C.id);add(9,'expense',170+rnd()*40,'Conta de luz (exemplo)','c-contas',A.id);
    if(k===1)add(21,'income',900,'Projeto freelance (exemplo)','c-free',A.id);
    if(k>0){const tot=d.transactions.filter(t=>t.accountId===C.id&&t.type==='expense'&&t.date.slice(0,7)===m).reduce((x,t)=>x+t.amount,0);d.transactions.push({id:uid(),type:'transfer',amount:r2(tot),date:m+'-27',desc:'Pagamento da fatura (exemplo)',accountId:A.id,toAccountId:C.id,paid:true,demo:true,createdAt:Date.now()})}}
  const B={'c-alim':1500,'c-transp':500,'c-casa':1600,'c-lazer':450,'c-saude':350,'c-compras':400,'c-contas':400};d.demoBudgets=[];
  for(const [id,v] of Object.entries(B))if(!(d.budgets[id]>0)){d.budgets[id]=v;d.demoBudgets.push(id)}
  d.goals.push({id:uid(),name:'Reserva de emergência (exemplo)',target:15000,saved:4200,deadline:addMonths(mk,12)+'-15',demo:true},{id:uid(),name:'Viagem (exemplo)',target:6000,saved:1500,deadline:addMonths(mk,8)+'-10',demo:true});
  save()}
function removeDemo(){
  const d=D(),rid=new Set(d.recurring.filter(r=>r.demo).map(r=>r.id)),aid=new Set(d.accounts.filter(a=>a.demo).map(a=>a.id));
  d.transactions=d.transactions.filter(t=>!t.demo&&!rid.has(t.recurringId)&&!aid.has(t.accountId)&&!aid.has(t.toAccountId));
  d.recurring=d.recurring.filter(r=>!r.demo&&!aid.has(r.accountId));d.accounts=d.accounts.filter(a=>!a.demo);d.goals=d.goals.filter(g=>!g.demo);
  (d.demoBudgets||[]).forEach(id=>delete d.budgets[id]);d.demoBudgets=[];d.demo=false;save()}

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return}
  const lk=e.target.closest&&e.target.closest('a[href^="#/"]:not([data-act])');if(lk){e.preventDefault();go(lk.getAttribute('href').slice(1));return}
  const sb=e.target.closest&&e.target.closest('button[type=submit]');if(sb&&sb.form&&sb.form.dataset.form){e.preventDefault();const ff=FORMS[sb.form.dataset.form];if(ff)ff(sb.form);return}
  const s=e.target.closest('[data-scroll]');if(s){e.preventDefault();scrollToSec(s.dataset.scroll);return}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='A')e.preventDefault();fn(el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal()});
function onFilter(e){const el=e.target;
  if(el.matches&&el.matches('[data-filter]')){S.ui.f[el.dataset.filter]=el.value;S.ui.limit=60;if(el.dataset.filter==='period'){render()}else{const l=$('#txnList');if(l)l.innerHTML=txListHTML()}}
  else if(el.matches&&el.matches('[data-rep="pend"]')){S.ui.repPend=el.checked;render()}
  else if(el.matches&&el.matches('[data-setting]')){D().settings[el.dataset.setting]=+el.value;save();toast('Preferência salva');render()}}
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('[data-filter="q"]'))onFilter(e)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-filter]:not([data-filter="q"]),[data-rep],[data-setting]'))return onFilter(e);
  if(t.id==='tpaid')t.dataset.touched='1';
  if(t.id==='td'){const p=$('#tpaid');if(p&&!p.dataset.touched)p.checked=t.value<=today()}
  if(t.matches&&t.matches('[data-accType]')){const c=t.value==='cartao';$('#cardBox').hidden=!c;$('#lblInit').textContent=c?'Fatura já em aberto (R$)':'Saldo inicial (R$)'}
  if(t.id==='restoreInput'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='finansmart'||!j.data||!Array.isArray(j.data.transactions)||!Array.isArray(j.data.accounts)||!j.data.accounts.length)throw 0;
    confirmBox({title:'Restaurar backup?',text:'Os dados atuais serão substituídos pelos do arquivo ('+j.data.transactions.length+' lançamentos).',ok:'Restaurar',danger:true,onOk(){const base=newData();S.data=Object.assign(base,j.data);materialize();save();toast('Backup restaurado');render()}})}catch(err){toast('Arquivo de backup inválido.',true)}};r.readAsText(t.files[0]);t.value=''}});

const PAGES={dashboard:pageDashboard,lancamentos:pageLanc,contas:pageContas,recorrentes:pageRec,calendario:pageCal,metas:pageMetas,orcamento:pageOrc,relatorios:pageRel,ia:pageIA,notificacoes:pageNotif,configuracoes:pageConfig};
function curPath(){const h=ROUTE!==null?ROUTE:(location.hash.replace(/^#/,'')||'/');return{p:h.split('?')[0]||'/'}}
const EMBED=/[?&#]embed/.test(location.href);
const STORAGE_OK=(function(){try{localStorage.setItem('fs:t','1');localStorage.removeItem('fs:t');return true}catch(e){return false}})();
function guard(p){
  const u=S.user;
  if(p.startsWith('/app')&&!u)return'/entrar';
  if(['/planos','/checkout','/assinar'].includes(p))return u?'/app/dashboard':'/cadastro';
  if(['/entrar','/cadastro','/recuperar'].includes(p)&&u)return'/app/dashboard';
  if(p==='/'&&EMBED)return u?'/app/dashboard':'/entrar';
  return null}
const TITLES={'/':'FinanSmart AI — organização financeira com IA','/planos':'Planos — FinanSmart AI','/entrar':'Entrar — FinanSmart AI','/cadastro':'Criar conta — FinanSmart AI','/recuperar':'Recuperar senha — FinanSmart AI','/checkout':'Assinatura — FinanSmart AI','/assinar':'Assine — FinanSmart AI'};

  if(p!==S.ui.lastPath){window.scrollTo(0,0);S.ui.lastPath=p;closeModal()}render()}
function render(){_render();if(!STORAGE_OK){const a=$('#app');if(a)a.insertAdjacentHTML('afterbegin','<div class="banner" style="margin:.6rem">'+ico('alert')+'<span>Este navegador bloqueia o salvamento de dados dentro de janelas incorporadas. Abra o app em uma nova aba para não perder seus dados.</span><a class="btn sm" target="_blank" rel="noopener" href="'+esc(location.href.split('#')[0])+'">Abrir em nova aba</a></div>')}}
function _render(){
  const p=curPath().p,app=$('#app');
  if(p.startsWith('/app')){let pg=p.split('/')[2]||'dashboard';if(!PAGES[pg])pg='dashboard';
    if(D().settings==null)loadData();materialize();
    app.innerHTML=shell(pg,PAGES[pg]());document.title=(NAV.find(n=>n[0]===pg)||[])[1]+' — FinanSmart AI';
    if(pg==='ia')renderAiChat();return}
  const map={'/':pageLanding,'/planos':pagePlanos,'/entrar':pageLogin,'/cadastro':pageSignup,'/recuperar':pageRecover,'/checkout':pageCheckout,'/assinar':pagePaywall};
  app.innerHTML=(map[p]||pageLanding)();document.title=TITLES[p]||TITLES['/'];if(p==='/')bindSim();if(p==='/checkout')drawPixQr()}
function drawPixQr(){
  const box=$('#pixQr'),code=$('#pixCode');if(!box||!code)return;
  const draw=()=>{try{const qr=window.qrcode(0,'M');qr.addData(code.value);qr.make();box.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});box.hidden=false}catch(e){box.hidden=true}};
  if(window.qrcode)return draw();
  const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=()=>{if($('#pixQr')===box)draw()};document.head.appendChild(sc)}

/* ================= início ================= */
applyTheme();
(function init(){
  const s=LS.get('fs:session',null);
  if(s){const u=S.users.find(x=>x.id===s.uid);if(u){S.user=u;refreshSub(u);loadData();S.ui.aiTurns=(can('hist')&&D().aiChat)||[]}}
  window.addEventListener('hashchange',()=>{ROUTE=null;route()});window.addEventListener('popstate',()=>{ROUTE=null;route()});
  if(window.matchMedia)try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(LS.get('fs:theme','system')==='system')render()})}catch(e){}
  route();
  const done=()=>{S.ui.sampleChecked=true;if(curPath().p==='/app/ia'&&!S.ui.aiBusy)render()};
  if(window.claude&&claude.use)claude.use('sample').then(f=>{SAMPLE=f||null;done()}).catch(done);else S.ui.sampleChecked=true;
})();
})();
</script>
